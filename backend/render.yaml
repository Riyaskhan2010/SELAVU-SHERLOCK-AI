services:
  - type: web
    name: costlens-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: costlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: ALLOWED_ORIGINS
        value: https://your-frontend.vercel.app

databases:
  - name: costlens-db
    databaseName: costlens
    user: costlens
    plan: free
